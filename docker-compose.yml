services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: backend/.env
    volumes:
      - ./backend/chroma:/app/chroma
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    ports:
    
      - "5173:80"
    depends_on:
      - backend
